<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель администратора</title>
    <link rel="stylesheet" href="style.css">
    <style>
        form {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        input, textarea, button, select {
            display: block;
            margin-bottom: 10px;
            padding: 8px;
            width: 300px;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .notification {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <h1>Панель администратора</h1>

    <div id="chat-container">
        <h2>Чат поддержки клиентов</h2>
        <div id="chat-messages"></div>
        <input type="text" id="message-input" placeholder="Введите ответ">
        <button id="send-button">Отправить</button>
    </div>

    <form id="addProductForm">
        <h2>Добавить товар</h2>
        <input type="number" id="id" placeholder="ID" required>
        <input type="text" id="name" placeholder="Название" required>
        <input type="number" id="price" placeholder="Цена" required>
        <textarea id="description" placeholder="Описание" required></textarea>
        <input type="text" id="category" placeholder="Категория" required>
        <button type="submit">Добавить товар</button>
    </form>

    <form id="editProductForm">
        <h2>Редактировать товар</h2>
        <input type="number" id="editId" placeholder="ID товара" required>
        <input type="text" id="editName" placeholder="Новое название">
        <input type="number" id="editPrice" placeholder="Новая цена">
        <textarea id="editDescription" placeholder="Новое описание"></textarea>
        <input type="text" id="editCategory" placeholder="Новая категория">
        <button type="submit">Редактировать товар</button>
    </form>

    <form id="deleteProductForm">
        <h2>Удалить товар</h2>
        <input type="number" id="deleteId" placeholder="ID товара" required>
        <button type="submit">Удалить товар</button>
    </form>

    <script>
        // WebSocket чат
        const chatSocket = new WebSocket('ws://localhost:8081');
        const chatMessages = document.getElementById('chat-messages');
        const messageInput = document.getElementById('message-input');
        const sendButton = document.getElementById('send-button');

        chatSocket.onopen = () => {
            chatSocket.send(JSON.stringify({ type: 'admin' }));
        };

        chatSocket.onmessage = (event) => {
            const message = JSON.parse(event.data);
            const messageElement = document.createElement('div');
            
            if (message.type === 'notification') {
                messageElement.innerHTML = `<p class="notification">${message.message}</p>`;
            } else if (message.type === 'message') {
                messageElement.innerHTML = `
                    <p><strong>${message.from === 'admin' ? 'Вы' : 'Клиент'}:</strong> 
                    ${message.text} <em>${new Date(message.timestamp).toLocaleTimeString()}</em></p>
                `;
            }
            chatMessages.appendChild(messageElement);
        };

        sendButton.addEventListener('click', () => {
            const text = messageInput.value.trim();
            if (text) {
                chatSocket.send(JSON.stringify({ 
                    type: 'message', 
                    text: text 
                }));
                messageInput.value = '';
            }
        });

        // Управление товарами
        document.getElementById('addProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const product = {
                id: parseInt(document.getElementById('id').value),
                name: document.getElementById('name').value,
                price: parseFloat(document.getElementById('price').value),
                description: document.getElementById('description').value,
                category: document.getElementById('category').value
            };

            try {
                const response = await fetch('http://localhost:8080/api/products', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(product)
                });

                if (response.ok) {
                    alert('Товар добавлен!');
                    e.target.reset();
                } else {
                    alert('Ошибка при добавлении товара');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка при добавлении товара');
            }
        });

        document.getElementById('editProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const productId = parseInt(document.getElementById('editId').value);
            const updatedData = {
                name: document.getElementById('editName').value,
                price: parseFloat(document.getElementById('editPrice').value),
                description: document.getElementById('editDescription').value,
                category: document.getElementById('editCategory').value
            };

            try {
                const response = await fetch(`http://localhost:8080/api/products/${productId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedData)
                });

                if (response.ok) {
                    alert('Товар обновлен!');
                    e.target.reset();
                } else {
                    alert('Ошибка при обновлении товара');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка при обновлении товара');
            }
        });

        document.getElementById('deleteProductForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const productId = parseInt(document.getElementById('deleteId').value);

            try {
                const response = await fetch(`http://localhost:8080/api/products/${productId}`, {
                    method: 'DELETE'
                });

                if (response.ok) {
                    alert('Товар удален!');
                    e.target.reset();
                } else {
                    alert('Ошибка при удалении товара');
                }
            } catch (error) {
                console.error('Ошибка:', error);
                alert('Ошибка при удалении товара');
            }
        });
    </script>
</body>
</html>
